name: 'publish'

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for (choose a single target or "all")'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - macos-aarch64
          - macos-x86_64
          - ubuntu
          - ubuntu-arm
          - windows
  push:
    branches:
      - master

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          ALL='[
            {"id":"macos-aarch64","runs_on":"macos-latest","args":"--target aarch64-apple-darwin"},
            {"id":"macos-x86_64","runs_on":"macos-latest","args":"--target x86_64-apple-darwin"},
            {"id":"ubuntu","runs_on":"ubuntu-24.04"},
            {"id":"ubuntu-arm","runs_on":"ubuntu-24.04-arm"},
            {"id":"windows","runs_on":"windows-2022"}
          ]'
          PLATFORM="${{ github.event.inputs.platform }}"
          if [[ -z "$PLATFORM" || "$PLATFORM" == "all" ]]; then
            INCLUDE="$ALL"
          else
            INCLUDE=$(echo "$ALL" | jq "[.[] | select(.id == \"$PLATFORM\")]")
          fi
          echo "matrix=$(echo "$INCLUDE" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: setup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.runs_on, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils protobuf-compiler

      - name: install protoc (macOS)
        if: matrix.runs_on == 'macos-latest'
        run: brew install protobuf

      - name: install protoc (Windows)
        if: startsWith(matrix.runs_on, 'windows')
        run: choco install protoc -y

      - name: install vcpkg and zlib (Windows)
        if: startsWith(matrix.runs_on, 'windows')
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          pushd C:\vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe integrate install
          .\vcpkg.exe install zlib:x64-windows
          echo "VCPKG_ROOT=C:\\vcpkg" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows" >> $GITHUB_ENV

      - name: install zlib (macOS x86_64)
        if: matrix.args == '--target x86_64-apple-darwin'
        run: |
          brew install zlib || true
          echo "ZLIB_DIR=$(brew --prefix zlib 2>/dev/null || echo /usr/local/opt/zlib)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix zlib 2>/dev/null || echo /usr/local/opt/zlib)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: install OpenSSL for macOS x86_64 (try Intel Homebrew via Rosetta)
        if: matrix.args == '--target x86_64-apple-darwin'
        run: |
          set -e
          # Try to install/use Intel Homebrew under Rosetta to provide x86_64 libs
          if [ -x "/usr/bin/arch" ]; then
            if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
              if [ -x "/usr/local/bin/brew" ]; then
                echo "Using existing Intel Homebrew at /usr/local"
              else
                /usr/bin/arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
              fi
              /usr/bin/arch -x86_64 /usr/local/bin/brew install openssl@3 || true
              OPENSSL_DIR="/usr/local/opt/openssl@3"
            else
              brew install openssl@3 || true
              OPENSSL_DIR="$(brew --prefix openssl@3 2>/dev/null || echo /opt/homebrew/opt/openssl@3)"
            fi
          else
            brew install openssl@3 || true
            OPENSSL_DIR="$(brew --prefix openssl@3 2>/dev/null || echo /opt/homebrew/opt/openssl@3)"
          fi
          echo "OPENSSL_DIR=$OPENSSL_DIR" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_DIR/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runs_on == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: npm ci

      - name: Build Vite frontend
        run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: tentacle-v__VERSION__
          releaseName: 'Tentacle v__VERSION__'
          releaseBody: 'tentacle  release v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}