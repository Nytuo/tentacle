[package]
name = "tentacle"
version = "0.1.0"
description = "A privacy-first Git GUI client"
authors = []
edition = "2021"

[lib]
name = "tentacle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenSSL is compiled in rather than taken from the system. Linking Homebrew's
# copy made macOS builds depend on it at runtime, and cross-compiling for Intel
# Macs from an ARM runner had no x86_64 OpenSSL to find at all.
git2 = { version = "0.20", features = ["vendored-openssl"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
notify = "8"
keyring = "3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
toml = "0.8"
futures = "0.3"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
